name: Release browser distributions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: python tools/build_distributions.py
      - run: node --check dist/ccf-lens.user.js
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            "dist/venuerank-lens-chrome-$VERSION.zip" \
            "dist/venuerank-lens-edge-$VERSION.zip" \
            dist/ccf-lens.user.js \
            --generate-notes
