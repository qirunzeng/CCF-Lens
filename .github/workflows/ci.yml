name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  data-and-matcher-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/*.test.mjs
      - run: node --check WebExtension/content.js
      - run: python tools/build_distributions.py
      - run: node --check dist/ccf-lens.user.js
      - run: git diff --exit-code -- dist/ccf-lens.user.js
      - uses: actions/upload-artifact@v7
        with:
          name: browser-distributions
          path: dist/
          if-no-files-found: error

  safari-project:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: >-
          xcodebuild
          -project "Safari/VenueRank Lens.xcodeproj"
          -scheme "VenueRank Lens"
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/CCFLensDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
