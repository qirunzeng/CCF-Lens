name: CCF Lens
options:
  bundleIdPrefix: com.qirunzeng
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TC3755P2NZ
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.2"
    SWIFT_VERSION: "5.0"
targets:
  CCF Lens:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qirunzeng.CCFLens
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: CCF Lens
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CCF Lens Extension
        embed: true
  CCF Lens Extension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - path: ../WebExtension
        type: folder
      - path: ../manifest.json
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: CCF Lens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qirunzeng.CCFLens.Extension
        PRODUCT_NAME: CCF Lens Extension
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
schemes:
  CCF Lens:
    build:
      targets:
        CCF Lens: all
        CCF Lens Extension: all
    run:
      config: Debug
